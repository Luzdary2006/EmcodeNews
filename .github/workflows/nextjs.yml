# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
        # Do NOT pass `static_site_generator: next`: it only understands
        # next.config.js/.cjs/.mjs, so it creates a separate next.config.js that
        # takes precedence over our next.config.ts and drops our basePath setup.
        # next.config.ts already defines output: "export", basePath and unoptimized images.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A Pages deployment can stay stuck in "in progress" (for example when a
      # previous run is cancelled or times out). While it is stuck, every new
      # deploy fails with: "Failed to create deployment (status: 400) ... due to
      # in progress deployment". Cancel those stale deployments before deploying.
      - name: Cancel stale Pages deployments
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          is_active() {
            case "$1" in
              deployment_in_progress|syncing_files|finished_file_sync|updating_pages|purging_cdn) return 0 ;;
              *) return 1 ;;
            esac
          }
          for sha in $(git log --format=%H -n 6); do
            [ "$sha" = "${GITHUB_SHA}" ] && continue
            code=$(curl -s -o /tmp/pages-deployment.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/pages/deployments/${sha}")
            echo "::warning::Pages deployment ${sha}: GET ${code} $(head -c 250 /tmp/pages-deployment.json)"
            [ "$code" = "200" ] || continue
            state=$(jq -r '.status // empty' /tmp/pages-deployment.json)
            if is_active "$state"; then
              echo "::warning::Cancelling stale Pages deployment ${sha} (${state})"
              curl -s -o /dev/null -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${api}/pages/deployments/${sha}/cancel" || true
              # Give Pages a moment to release the deployment lock.
              for _ in $(seq 1 12); do
                sleep 5
                state=$(curl -s \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "${api}/pages/deployments/${sha}" | jq -r '.status // empty')
                is_active "$state" || break
              done
              echo "::warning::After cancel, Pages deployment ${sha} is: ${state:-unknown}"
            else
              echo "::warning::Pages deployment ${sha} state: ${state:-none}"
            fi
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
